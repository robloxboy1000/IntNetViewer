<!doctype html>
<html>
<head>
<title>History</title>	
</head>
	<body>
	<h2>History</h2>
	<div id="linkContainer"></div>
	<script>
        async function LoadHistory() {
            var $container = document.getElementById("linkContainer")

            try {
                await CefSharp.BindObjectAsync("host");
                if (!host || typeof host.getHistory !== "function") {
                    throw new Error("host object or getHistory function is not available.");
                }
                var history = await host.getHistory();
            } catch (error) {
                console.error("Error loading history:", error);
                return;
            }
            var historyList = history.split("\r\n");
            for (var i = 0; i < historyList.length; i++) {
                var linkUrl = historyList[i];
                if (linkUrl.trim() !== "") {
                    const link = document.createElement("a");
                    link.href = linkUrl;
                    link.textContent = linkUrl;
                    link.target = "_blank";
                    const listItem = document.createElement("div");
                    listItem.appendChild(link);
                    $container.appendChild(listItem);
                }
            }
            
                
            
                
            
        }
        LoadHistory();

        
    </script>
	</body>
</html>
